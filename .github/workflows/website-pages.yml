name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Website/minidit/**"
      - ".github/workflows/website-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website/minidit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website/minidit/package-lock.json
      - run: npm ci
      - run: npm run build:pages
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /MiniDiT
          NEXT_PUBLIC_SITE_URL: https://751k.github.io/MiniDiT/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Website/minidit/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
